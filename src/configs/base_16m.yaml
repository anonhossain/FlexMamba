#src/configs/base_16m.yaml
experiment:
  project_name: FlexMamba
  scale: 16m
  seed: 42
  runs_root: runs

data:
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT
  tokenizer_name: HuggingFaceTB/SmolLM-135M
  validation_docs: 2000
  shuffle_buffer: 5000
  streaming: true

training:
  batch_size: 4
  grad_accum_steps: 8

  max_steps: 2000

  learning_rate: 0.001
  min_learning_rate: 0.0001
  warmup_ratio: 0.10

  weight_decay: 0.10
  beta1: 0.9
  beta2: 0.95

  grad_clip: 1.0

  log_every: 10

checkpoint:
  save_steps:
    - 500
    - 1000
    - 1500
    - 2000