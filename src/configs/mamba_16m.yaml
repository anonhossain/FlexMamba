model_type: mamba
seed: 42

model:
  vocab_size: 49152

  d_model: 256
  n_layers: 8

  d_state: 16
  expand: 2
  d_conv: 4

  max_seq_len: 256

  tie_word_embeddings: true
  use_bias: false
  use_conv_bias: true
  residual_in_fp32: true


data:
  dataset_name: "HuggingFaceFW/fineweb-edu"
  dataset_config: "sample-10BT"

  tokenizer_name: "HuggingFaceTB/SmolLM-135M"

  validation_docs: 1000
  shuffle_buffer: 10000


training:
  batch_size: 4
  grad_accum_steps: 8

  max_steps: 2000

  learning_rate: 0.001
  min_learning_rate: 0.0001

  beta1: 0.9
  beta2: 0.95

  weight_decay: 0.1
  grad_clip: 1.0

  warmup_ratio: 0.1

  log_every: 10
  eval_every: 200
  eval_batches: 20

  save_every: 500

  output_dir: "checkpoints/mamba_16m"