technique:
  stage: 10
  name: final_joint
  model_type: flexmamba
  experiment_type: training

inherits: quantization_aware_tuning

parent:
  technique: quantization_aware_tuning
  selected_run: auto
  checkpoint_step: 1000

experiment:
  project_name: FlexMamba
  scale: 16m # 30m
  seed: 42
  runs_root: runs

data:
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT
  tokenizer_name: HuggingFaceTB/SmolLM-135M
  validation_docs: 2000
  shuffle_buffer: 5000
  streaming: true

model:
  vocab_size: 49152
  d_model: 384

  input_layers: 1
  shared_middle_layers: 2
  output_layers: 1

  d_state: 16
  expand: 2
  d_conv: 4
  max_seq_len: 256

  tie_word_embeddings: true
  use_bias: false
  use_conv_bias: true
  residual_in_fp32: true
  layer_norm_eps: 1.0e-5

recursion:
  mode: dynamic
  min_recursions: 1
  max_recursions: 3 # 4

state:
  mode: recursion_wise
  share_state_across_recursions: false

routing:
  enabled: true
  router_type: token_choice
  balance_loss_coeff: 0.01
  z_loss_coeff: 0.001

grouped_parameterization:
  enabled: true
  groups: 4
  group_input_projection: true
  group_output_projection: true
  group_ssm_projection: true
  channel_shuffle: true

lte:
  enabled: true
  num_bins: 8
  minimum_active_bins: 2
  maximum_active_bins: 8
  router_type: sigmoid
  threshold: 0.5
  efficiency_loss_coeff: 0.01
  target_active_fraction: 0.50

quantization:
  enabled: true
  target: recurrent_ssm_state
  state_bits: 8
  fake_quantization: true
  symmetric: true
  per_channel: true

initialization:
  mode: warm_start
  strategy: load_parent

training:
  batch_size: 2
  grad_accum_steps: 16
  max_steps: 2442

  learning_rate: 0.0005
  min_learning_rate: 0.00005
  warmup_ratio: 0.10

  weight_decay: 0.10
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  log_every: 10

budget:
  type: iso_token
  tokens_per_step: 8192
  training_tokens: 20004864

validation:
  enabled: true
  eval_every: 250
  eval_batches: 20

checkpoint:
  save_steps: [500, 1000, 1500, 2000, 2442]

evaluation:
  enabled: true
  fixed_data: true
  cache_path: data/evaluation/fineweb_eval_256.pt
  batch_size: 2
  eval_batches: 100

  collect:
    quality: true
    architecture: true
    parameters: true
    active_parameters: true
    recursion: true
    routing: true
    sparsity: true
    quantization: true
    flops: true
    active_flops: true
    throughput: true
    latency: true
    memory: true
    state_memory: true
    storage: true