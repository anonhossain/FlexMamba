technique:
  stage: 0
  name: mor
  model_type: mor
  experiment_type: training


inherits: null


parent:
  technique: null
  selected_run: null
  checkpoint_step: null


experiment:
  project_name: FlexMamba
  scale: 30m
  seed: 42
  runs_root: runs
  debug: false


initialization:
  mode: scratch


# ============================================================
# MODEL
# ============================================================

model:
  vocab_size: 49152

  d_model: 448

  n_heads: 8
  n_kv_heads: 2
  d_ff: 1344

  n_shared_layers: 3
  num_recursions: 3

  max_seq_len: 256

  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5

  router_type: token_choice
  router_hidden_mult: 1

  router_balance_coeff: 0.01
  router_z_loss_coeff: 0.001

  tie_embeddings: true


# ============================================================
# DATA
# ============================================================

data:
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT

  tokenizer_name: HuggingFaceTB/SmolLM-135M

  validation_docs: 2000
  shuffle_buffer: 5000

  streaming: true


# ============================================================
# TRAINING
# ============================================================

training:
  batch_size: 1
  grad_accum_steps: 8

  max_steps: 500

  learning_rate: 0.0005
  min_learning_rate: 0.00005
  warmup_ratio: 0.05

  beta1: 0.9
  beta2: 0.95

  weight_decay: 0.10
  grad_clip: 1.0

  log_every: 10


# ============================================================
# BUDGET
# ============================================================

budget:
  type: fixed_steps

  tokens_per_step: 2048
  training_tokens: 1024000


# ============================================================
# VALIDATION
# ============================================================

validation:
  enabled: true

  eval_every: 100
  eval_batches: 5


# ============================================================
# CHECKPOINT
# ============================================================

checkpoint:
  save_steps:
    - 100
    - 250
    - 500


# ============================================================
# POST-TRAINING EVALUATION
# ============================================================

evaluation:
  enabled: true

  batch_size: 1
  eval_batches: 5

  run_benchmarks: false