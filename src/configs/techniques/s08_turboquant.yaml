technique:
  stage: 8
  name: turboquant_state
  model_type: turboquant_mamba
  experiment_type: compression_evaluation

inherits: grouped_lte

parent:
  technique: grouped_lte
  selected_run: auto
  checkpoint_step: 2442

experiment:
  project_name: FlexMamba
  scale: 16m # 30m
  seed: 42
  runs_root: runs

data:
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT
  tokenizer_name: HuggingFaceTB/SmolLM-135M
  validation_docs: 2000
  streaming: true

model:
  vocab_size: 49152
  d_model: 256 #384
  d_state: 16
  max_seq_len: 256

state_quantization:
  enabled: true
  target: recurrent_ssm_state

  bits: 8
  symmetric: true
  per_channel: true

  calibration_batches: 50
  calibration_method: percentile
  calibration_percentile: 99.9

  quantize_during_prefill: true
  quantize_during_decode: true

training:
  enabled: false

budget:
  type: calibration
  calibration_batches: 50

evaluation:
  enabled: true
  fixed_data: true
  cache_path: data/evaluation/fineweb_eval_256.pt
  batch_size: 2
  eval_batches: 50

  collect:
    quality: true
    perplexity_change: true
    state_memory: true
    compression_ratio: true
    throughput: true
    latency: true
    peak_memory: true