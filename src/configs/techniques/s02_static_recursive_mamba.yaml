technique:
  stage: 2
  name: static_recursive_mamba
  model_type: recursive_mamba
  experiment_type: training

inherits: mamba

parent:
  technique: mamba
  selected_run: auto

experiment:
  project_name: FlexMamba
  scale: 16m
  seed: 42
  runs_root: runs
  debug: true

initialization:
  mode: warm_start
  strategy: cycle_average

model:
  vocab_size: 49152
  d_model: 256

  input_layers: 1
  shared_middle_layers: 2
  num_recursions: 3
  output_layers: 1

  d_state: 16
  expand: 2
  d_conv: 4
  max_seq_len: 256

  tie_word_embeddings: true
  use_bias: false
  use_conv_bias: true
  residual_in_fp32: true
  layer_norm_eps: 1.0e-5

data:
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT
  tokenizer_name: HuggingFaceTB/SmolLM-135M
  validation_docs: 2000
  shuffle_buffer: 5000

training:
  batch_size: 2
  grad_accum_steps: 16
  max_steps: 1

  learning_rate: 0.001
  min_learning_rate: 0.0001
  warmup_ratio: 0.10

  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.10
  grad_clip: 1.0
  log_every: 1

validation:
  enabled: true
  eval_every: 1
  eval_batches: 1

checkpoint:
  save_steps: [1]

evaluation:
  enabled: true
  batch_size: 2
  eval_batches: 1
  run_benchmarks: false