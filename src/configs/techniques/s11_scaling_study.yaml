technique:
  stage: 11
  name: scaling_study
  model_type: flexmamba
  experiment_type: scaling


inherits: final_joint


parent:
  technique: final_joint
  selected_run: auto

  # S11 uses S10 only as an architecture reference.
  role: architecture_reference
  load_weights: false


experiment:
  project_name: FlexMamba
  seed: 42
  runs_root: runs
  debug: false


# ============================================================
# DATA
# ============================================================

data:
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT

  tokenizer_name: HuggingFaceTB/SmolLM-135M

  validation_docs: 2000
  shuffle_buffer: 5000

  streaming: true


# ============================================================
# SCALING STUDY
# ============================================================

scaling:
  section_title: FlexMamba Scale-Efficiency Analysis

  target_basis: unrolled_dense_equivalent_parameters

  parameter_tolerance_percent: 5

  scaling_axis: width
  width_multiple: 64

  minimum_d_model: 128
  maximum_d_model: 8192

  preserve_architecture: true

  # Mac pilot:
  # evaluate only the ~30M scale.
  targets:
    - name: 30m
      target_parameters: 30000000


# ============================================================
# MODEL TEMPLATE
# ============================================================

model_template:
  vocab_size: 49152

  d_state: 16
  expand: 2
  d_conv: 4

  input_layers: 1
  shared_middle_layers: 2
  output_layers: 1

  # Mac pilot context.
  max_seq_len: 256

  tie_word_embeddings: true

  use_bias: false
  use_conv_bias: true

  residual_in_fp32: true
  layer_norm_eps: 1.0e-5


# ============================================================
# DYNAMIC RECURSION
# ============================================================

recursion:
  mode: dynamic

  min_recursions: 1
  max_recursions: 3


# ============================================================
# RECURSION-WISE STATE
# ============================================================

state:
  mode: recursion_wise

  share_block_weights: true
  share_state_across_recursions: false

  reset_state_between_sequences: true


# ============================================================
# ROUTING
# ============================================================

routing:
  enabled: true

  router_type: token_choice
  hidden_multiplier: 1

  temperature: 1.0

  hard_routing: true
  straight_through: true

  balance_loss_coeff: 0.01
  z_loss_coeff: 0.001

  initialize_to_parent_depth: true
  max_depth_bias: 0.01


# ============================================================
# GROUPED PARAMETERIZATION
# ============================================================

grouped_parameterization:
  enabled: true

  groups: 4

  group_input_projection: true
  group_output_projection: true
  group_ssm_projection: true

  channel_shuffle: true


# ============================================================
# LTE ADAPTIVE WIDTH
# ============================================================

lte:
  enabled: true

  apply_to: shared_middle

  num_bins: 8

  minimum_active_bins: 2
  maximum_active_bins: 8

  router_type: sigmoid
  threshold: 0.5

  straight_through: true

  efficiency_loss_coeff: 0.01
  target_active_fraction: 0.50

  initialize_all_active: true
  initial_logit: 4.0


# ============================================================
# RECURRENT-STATE QUANTIZATION
# ============================================================

state_quantization:
  enabled: true

  target: recurrent_ssm_state

  bits: 8

  symmetric: true
  per_channel: true

  rotation: randomized_hadamard

  calibration_method: percentile
  calibration_percentile: 99.9

  max_samples_per_channel: 16384


# ============================================================
# QUANTIZATION-AWARE TRAINING
# ============================================================

quantization:
  enabled: true

  target: recurrent_ssm_state

  state_bits: 8

  fake_quantization: true
  straight_through_estimator: true

  freeze_quantizer_scales: true

  quantization_loss_coeff: 0.0


# ============================================================
# INITIALIZATION
# ============================================================

initialization:
  mode: from_scratch


# ============================================================
# CALIBRATION
# ============================================================

calibration:
  enabled: true

  batches: 4


# ============================================================
# FULL-SCALE BUDGET
#
# These settings are retained for later experiments.
# The Mac pilot below uses the smoke section instead.
# ============================================================

budget:
  protocol: fixed_tokens

  paper_reference_tokens: 20000000000
  prototype_scale_factor: 0.001

  training_tokens_per_scale: 20000000

  paper_iso_flop_budgets:
    - 2.0e18
    - 5.0e18
    - 1.65e19


# ============================================================
# FULL TRAINING SETTINGS
#
# Not used while smoke.enabled = true.
# ============================================================

training:
  enabled: true

  micro_batch_size: 1
  global_tokens_per_update: 1024

  sequence_tokens: 128

  learning_rate: 0.0003
  min_learning_rate: 0.0

  scheduler: trapezoid

  warmup_ratio: 0.05
  cooldown_ratio: 0.20

  beta1: 0.9
  beta2: 0.95

  weight_decay: 0.10
  grad_clip: 1.0

  log_every: 10


# ============================================================
# VALIDATION
# ============================================================

validation:
  enabled: true

  eval_every: 50
  eval_batches: 5

  sequence_tokens: 128


# ============================================================
# EVALUATION
# ============================================================

evaluation:
  enabled: true

  fixed_data: true

  batch_size: 1
  eval_batches: 5

  primary_sequence_length: 128

  sequence_lengths:
    - 64
    - 128
    - 256

  collect:
    quality: true

    parameters: true
    active_parameters: true

    recursion: true
    routing: true
    sparsity: true

    quantization: true

    flops: true
    active_flops: true

    throughput: true
    latency: true
    memory: true

    state_memory: true
    storage: true

    scaling_efficiency: true


# ============================================================
# MAC 30M DIAGNOSTIC RUN
# ============================================================

smoke:
  enabled: true

  targets:
    - 30m

  max_steps: 10

  sequence_tokens: 128

  calibration_batches: 2
  eval_batches: 2

  sequence_lengths:
    - 128