technique:
  stage: 8
  name: turboquant_state
  model_type: turboquant_mamba
  experiment_type: compression_evaluation


inherits: grouped_lte


parent:
  technique: grouped_lte
  selected_run: auto


experiment:
  project_name: FlexMamba
  scale: 30m
  seed: 42
  runs_root: runs
  debug: false


# ============================================================
# MODEL
# ============================================================

model:
  vocab_size: 49152

  d_model: 448

  input_layers: 1
  shared_middle_layers: 2
  output_layers: 1

  d_state: 16
  expand: 2
  d_conv: 4

  max_seq_len: 256

  tie_word_embeddings: true

  use_bias: false
  use_conv_bias: true

  residual_in_fp32: true
  layer_norm_eps: 1.0e-5


# ============================================================
# DYNAMIC RECURSION
# ============================================================

recursion:
  mode: dynamic

  min_recursions: 1
  max_recursions: 3


# ============================================================
# RECURSION-WISE STATE
# ============================================================

state:
  mode: recursion_wise

  share_block_weights: true
  share_state_across_recursions: false

  reset_state_between_sequences: true


# ============================================================
# ROUTING
# ============================================================

routing:
  enabled: true

  router_type: token_choice
  hidden_multiplier: 1

  temperature: 1.0

  hard_routing: true
  straight_through: true

  balance_loss_coeff: 0.01
  z_loss_coeff: 0.001

  initialize_to_parent_depth: true
  max_depth_bias: 0.01


# ============================================================
# GROUPED PARAMETERIZATION
# ============================================================

grouped_parameterization:
  enabled: true

  groups: 4

  group_input_projection: true
  group_output_projection: true
  group_ssm_projection: true

  channel_shuffle: true


# ============================================================
# LTE ADAPTIVE WIDTH
# ============================================================

lte:
  enabled: true

  apply_to: shared_middle

  num_bins: 8

  minimum_active_bins: 2
  maximum_active_bins: 8

  router_type: sigmoid
  threshold: 0.5

  straight_through: true

  efficiency_loss_coeff: 0.01
  target_active_fraction: 0.50

  initialize_all_active: true
  initial_logit: 4.0


# ============================================================
# RECURRENT-STATE QUANTIZATION
# ============================================================

state_quantization:
  enabled: true

  target: recurrent_ssm_state

  bits: 8

  symmetric: true
  per_channel: true

  rotation: randomized_hadamard

  calibration_method: percentile
  calibration_percentile: 99.9

  calibration_batches: 8
  max_samples_per_channel: 16384

  quantize_during_prefill: true
  quantize_during_decode: true

  evaluation_chunk_size: 64


# ============================================================
# DATA
# ============================================================

data:
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT

  tokenizer_name: HuggingFaceTB/SmolLM-135M

  validation_docs: 2000
  shuffle_buffer: 5000

  streaming: true


# ============================================================
# TRAINING
# ============================================================

training:
  enabled: false

  batch_size: 1


# ============================================================
# CALIBRATION BUDGET
# ============================================================

budget:
  type: calibration

  calibration_batches: 8


# ============================================================
# VALIDATION
# ============================================================

validation:
  enabled: true

  eval_batches: 5


# ============================================================
# CHECKPOINT
# ============================================================

checkpoint:
  save_compression_state: true


# ============================================================
# EVALUATION
# ============================================================

evaluation:
  enabled: true

  batch_size: 1
  eval_batches: 5

  chunk_size: 64

  run_benchmarks: false

  collect:
    quality: true
    perplexity_change: true

    state_memory: true
    compression_ratio: true

    throughput: true
    latency: true
    peak_memory: true