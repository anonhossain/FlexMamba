technique:
  stage: 3
  name: recursion_wise_state
  model_type: recursion_wise_state_mamba
  experiment_type: training


inherits: static_recursive_mamba


parent:
  technique: static_recursive_mamba
  selected_run: auto


experiment:
  project_name: FlexMamba
  scale: 30m
  seed: 42
  runs_root: runs
  debug: false


# ============================================================
# INITIALIZATION
# ============================================================

initialization:
  mode: warm_start
  strategy: copy_parent_weights


# ============================================================
# MODEL
# ============================================================

model:
  vocab_size: 49152

  d_model: 448

  input_layers: 1
  shared_middle_layers: 2
  num_recursions: 3
  output_layers: 1

  d_state: 16
  expand: 2
  d_conv: 4

  max_seq_len: 256

  tie_word_embeddings: true

  use_bias: false
  use_conv_bias: true

  residual_in_fp32: true
  layer_norm_eps: 1.0e-5


# ============================================================
# RECURSION-WISE STATE
# ============================================================

state:
  mode: recursion_wise

  share_block_weights: true
  share_state_across_recursions: false

  reset_state_between_sequences: true


# ============================================================
# DATA
# ============================================================

data:
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT

  tokenizer_name: HuggingFaceTB/SmolLM-135M

  validation_docs: 2000
  shuffle_buffer: 5000

  streaming: true


# ============================================================
# TRAINING
# ============================================================

training:
  batch_size: 1
  grad_accum_steps: 8

  max_steps: 200

  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_ratio: 0.05

  beta1: 0.9
  beta2: 0.95

  weight_decay: 0.10
  grad_clip: 1.0

  log_every: 10


# ============================================================
# BUDGET
# ============================================================

budget:
  type: fixed_steps

  tokens_per_step: 2048
  training_tokens: 409600


# ============================================================
# VALIDATION
# ============================================================

validation:
  enabled: true

  eval_every: 50
  eval_batches: 5


# ============================================================
# CHECKPOINT
# ============================================================

checkpoint:
  save_steps:
    - 100
    - 200


# ============================================================
# EVALUATION
# ============================================================

evaluation:
  enabled: true

  batch_size: 1
  eval_batches: 5

  run_benchmarks: false