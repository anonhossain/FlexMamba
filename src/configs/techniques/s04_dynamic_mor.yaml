technique:
  stage: 4
  name: dynamic_mor
  model_type: dynamic_recursive_mamba
  experiment_type: training

inherits: recursion_wise_state

parent:
  technique: recursion_wise_state
  selected_run: auto
  checkpoint_step: 2442

experiment:
  project_name: FlexMamba
  scale: 16m # 30m
  seed: 42
  runs_root: runs

data:
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT
  tokenizer_name: HuggingFaceTB/SmolLM-135M
  validation_docs: 2000
  shuffle_buffer: 5000
  streaming: true

model:
  vocab_size: 49152
  d_model: 256 #384

  input_layers: 1
  shared_middle_layers: 2
  output_layers: 1

  d_state: 16
  expand: 2
  d_conv: 4
  max_seq_len: 256

  tie_word_embeddings: true
  use_bias: false
  use_conv_bias: true
  residual_in_fp32: true
  layer_norm_eps: 1.0e-5

recursion:
  mode: dynamic
  min_recursions: 1
  max_recursions: 3 #4

state:
  mode: recursion_wise
  share_block_weights: true
  share_state_across_recursions: false

routing:
  enabled: true
  router_type: token_choice
  hidden_multiplier: 1

  balance_loss_coeff: 0.01
  z_loss_coeff: 0.001

  temperature: 1.0
  hard_routing: true

initialization:
  mode: warm_start
  strategy: copy_parent_init_router
  load_parent_optimizer: false
  load_parent_scheduler: false

training:
  batch_size: 2
  grad_accum_steps: 16
  max_steps: 2442
  learning_rate: 0.001
  min_learning_rate: 0.0001
  warmup_ratio: 0.10
  weight_decay: 0.10
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  log_every: 10

budget:
  type: iso_token
  tokens_per_step: 8192
  training_tokens: 20004864

validation:
  enabled: true
  eval_every: 250
  eval_batches: 20

checkpoint:
  save_steps: [500, 1000, 1500, 2000, 2442]

evaluation:
  enabled: true
  fixed_data: true
  cache_path: data/evaluation/fineweb_eval_256.pt
  batch_size: 2
  eval_batches: 50

  collect:
    quality: true
    architecture: true
    parameters: true
    recursion: true
    routing: true
    active_flops: true
    throughput: true
    latency: true
    memory: true
    storage: true