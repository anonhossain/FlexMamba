#src/configs/techniques16m/s04_lte.yaml
technique:
  name: lte
  model_type: lte
  experiment_type: training

inherits: dynamic_routing

parent:
  technique: dynamic_routing
  selected_run: auto
  checkpoint_step: 2000

initialization:
  mode: warm_start

  strategy: compatible

  load_parent_optimizer: false
  load_parent_scheduler: false

model:

  lte_enabled: true
  # Divide expanded Mamba channels into structured groups.
  num_bins: 8
  # Target fraction of channels that should remain inactive.
  target_sparsity: 0.50
  # Router/gating threshold.
  routing_threshold: 0.50
  # Additional sparsity/efficiency objective.
  efficiency_loss_coeff: 0.01
  # Initial implementation:
  # apply LTE to expanded internal channels.
  lte_target: expanded_channels

search:
  enabled: false
  mode: grid

  parameters:

    # Example later:
    #
    # target_sparsity:
    #   - 0.30
    #   - 0.50
    #   - 0.70
    #
    # num_bins:
    #   - 4
    #   - 8
    #   - 16
    #
    # routing_threshold:
    #   - 0.4
    #   - 0.5
    #   - 0.6
    {}