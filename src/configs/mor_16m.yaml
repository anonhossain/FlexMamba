model_type: mor
seed: 42

model:
  vocab_size: 49152
  d_model: 256
  n_heads: 4
  n_kv_heads: 2
  d_ff: 768
  n_shared_layers: 3
  num_recursions: 3
  max_seq_len: 256
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  router_type: token_choice
  router_hidden_mult: 1
  router_balance_coeff: 0.01
  router_z_loss_coeff: 0.001
  tie_embeddings: true

# Local Mac prototype settings. For the final cloud run, increase max_seq_len to 2048
# and scale d_model/layers to the desired parameter budget.
data:
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT
  tokenizer_name: HuggingFaceTB/SmolLM-135M
  validation_docs: 2000
  shuffle_buffer: 5000

training:
  batch_size: 4
  grad_accum_steps: 8
  max_steps: 2000
  learning_rate: 0.001
  min_learning_rate: 0.0001
  warmup_ratio: 0.10
  weight_decay: 0.10
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  log_every: 10
  eval_every: 200
  eval_batches: 20
  save_every: 500
  output_dir: checkpoints/mor_16m
