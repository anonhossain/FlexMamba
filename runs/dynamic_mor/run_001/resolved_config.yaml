  straight_through: true
  balance_loss_coeff: 0.01
  z_loss_coeff: 0.001
  initialize_to_parent_depth: true
  max_depth_bias: 0.01
data:
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT
  tokenizer_name: HuggingFaceTB/SmolLM-135M
  validation_docs: 2000
  shuffle_buffer: 5000
  streaming: true
training:
  batch_size: 1
  grad_accum_steps: 8
  max_steps: 300
  learning_rate: 0.0003
  min_learning_rate: 3.0e-05
  warmup_ratio: 0.05
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0
  log_every: 10
budget:
  type: fixed_steps
  tokens_per_step: 2048
  training_tokens: 614400
validation:
  enabled: true
  eval_every: 50
  eval_batches: 5
checkpoint:
