technique:
  stage: 4
  name: dynamic_mor
  model_type: dynamic_recursive_mamba
  experiment_type: training
inherits: recursion_wise_state
parent:
  technique: recursion_wise_state
  selected_run: auto
experiment:
  project_name: FlexMamba
  scale: 30m
  seed: 42
  runs_root: runs
  debug: false
initialization:
  mode: warm_start
  strategy: copy_parent_init_router
model:
  vocab_size: 49152
  d_model: 448
  input_layers: 1
  shared_middle_layers: 2
  output_layers: 1
