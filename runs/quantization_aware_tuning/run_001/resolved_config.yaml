technique:
  stage: 9
  name: quantization_aware_tuning
  model_type: qat_joint_mamba
  experiment_type: training
inherits: turboquant_state
parent:
  technique: turboquant_state
  selected_run: auto
experiment:
  project_name: FlexMamba
  scale: 16m
  seed: 42
  runs_root: runs
  debug: true
model:
  vocab_size: 49152
  d_model: 256
  input_layers: 1
  shared_middle_layers: 2
  output_layers: 1
  d_state: 16
  expand: 2
  d_conv: 4
  max_seq_len: 256
  tie_word_embeddings: true
  use_bias: false
  use_conv_bias: true
  residual_in_fp32: true
  layer_norm_eps: 1.0e-05
recursion:
  mode: dynamic
  min_recursions: 1
  max_recursions: 3
state:
  mode: recursion_wise
  share_block_weights: true
  share_state_across_recursions: false
  reset_state_between_sequences: true
routing:
  enabled: true
  router_type: token_choice
  hidden_multiplier: 1
  temperature: 1.0
  hard_routing: true
  straight_through: true
  balance_loss_coeff: 0.01
  z_loss_coeff: 0.001
  initialize_to_parent_depth: true
  max_depth_bias: 0.01
grouped_parameterization:
  enabled: true
  groups: 4
  group_input_projection: true
  group_output_projection: true
  group_ssm_projection: true
  channel_shuffle: true
lte:
  enabled: true
  apply_to: shared_middle
  num_bins: 8
  minimum_active_bins: 2
  maximum_active_bins: 8
  router_type: sigmoid
  threshold: 0.5
  straight_through: true
  efficiency_loss_coeff: 0.01
  target_active_fraction: 0.5
  initialize_all_active: true
  initial_logit: 4.0
state_quantization:
  enabled: true
  target: recurrent_ssm_state
  bits: 8
  symmetric: true
  per_channel: true
  rotation: randomized_hadamard
  calibration_method: percentile
  calibration_percentile: 99.9
quantization:
  enabled: true
  target: recurrent_ssm_state
  state_bits: 8
  fake_quantization: true
  straight_through_estimator: true
  reuse_parent_quantizer_state: true
  freeze_quantizer_scales: true
  quantization_loss_coeff: 0.0
data:
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT
  tokenizer_name: HuggingFaceTB/SmolLM-135M
  validation_docs: 2000
  shuffle_buffer: 5000
training:
  enabled: true
  batch_size: 2
  grad_accum_steps: 1
  max_steps: 1
  sequence_tokens: 32
  learning_rate: 0.0002
  min_learning_rate: 2.0e-05
  warmup_ratio: 0.05
  weight_decay: 0.05
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  log_every: 1
validation:
  enabled: true
  eval_every: 1
  eval_batches: 1
  sequence_tokens: 32
checkpoint:
  save_steps:
  - 1
evaluation:
  enabled: true
  batch_size: 2
  eval_batches: 1
  sequence_tokens: 32
  run_benchmarks: false
runtime:
  parent_checkpoint: C:\files\FlexMamba\runs\turboquant_state\run_001\checkpoints\step_0000000.pt
  parent_run_dir: null
  initialization_report:
    strategy: copy_s08_weights_reuse_quantizer_state
    transferred_parameter_count: 13152531
    new_trainable_parameters: 0
    total_parameter_count: 13152531
    transferred_parameter_fraction: 1.0
    quantizer_count: 6
    quantizer_scales_reused: true
