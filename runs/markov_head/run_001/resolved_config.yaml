  temperature: 1.0
  confidence_scheduler:
    enabled: false
training:
  enabled: true
  batch_size: 2
  grad_accum_steps: 16
  max_steps: 1000
  sequence_tokens: 256
  learning_rate: 0.0006
  min_learning_rate: 0.0
  warmup_ratio: 0.04
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
