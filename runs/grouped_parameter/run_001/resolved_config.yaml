technique:
  stage: 5
  name: grouped_parameter
  model_type: grouped_dynamic_mamba
  experiment_type: training
inherits: dynamic_mor
parent:
  technique: dynamic_mor
  selected_run: auto
experiment:
  project_name: FlexMamba
  scale: 16m
  seed: 42
  runs_root: runs
  debug: true
initialization:
  mode: warm_start
  strategy: group_parent_projections
model:
  vocab_size: 49152
  d_model: 256
  input_layers: 1
  shared_middle_layers: 2
  output_layers: 1
  d_state: 16
  expand: 2
  d_conv: 4
