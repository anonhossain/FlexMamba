  d_conv: 4
  max_seq_len: 256
  tie_word_embeddings: true
  use_bias: false
  use_conv_bias: true
  residual_in_fp32: true
  layer_norm_eps: 1.0e-05
search:
  enabled: false
  mode: grid
  parameters: {}
