  grad_accum_steps: 8
  max_steps: 2000
  learning_rate: 0.001
  min_learning_rate: 0.0001
  warmup_ratio: 0.1
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  log_every: 10
checkpoint:
  save_steps:
  - 500
  - 1000
  - 1500
  - 2000
technique:
  name: mamba
  model_type: mamba
  experiment_type: training
inherits: null
initialization:
  mode: scratch
  parent_technique: null
  parent_run: null
  parent_checkpoint: null
